name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 语法检查
        run: python .github/scripts/check_syntax.py

      - name: 敏感信息扫描
        run: python .github/scripts/check_secrets.py

      - name: 文档内链检查
        run: python .github/scripts/check_links.py
